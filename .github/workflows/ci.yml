name: CI

# Run on every push and pull request targeting main/master.
# Gate merges on: lint → unit tests → build → E2E tests.
on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject generated dist changes in feature PRs
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          npm run check:dist-review -- FETCH_HEAD

      - name: ESLint
        # Includes the architecture-boundary ratchet after ESLint.
        run: npm run lint

  # ─────────────────────────────────────────────
  # 2. Unit tests
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:critical

  # ─────────────────────────────────────────────
  # 3. Build
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 4. E2E tests (Playwright)
  # ─────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright E2E tests
        run: npm run e2e:critical
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  visual-regression:
    name: Desktop Visual Regression
    runs-on: windows-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run desktop visual regression
        run: npm run visual:regression
        env:
          CI: true

      - name: Upload visual differences on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: output/playwright/visual-results/
          retention-days: 14

  # ─────────────────────────────────────────────
  # 5. Browser performance contracts
  # ─────────────────────────────────────────────
  # Deterministic large-workload measurements fail when a required metric is
  # absent or crosses the committed budget.
  performance-contracts:
    name: Browser Performance Contracts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download previous base-branch performance report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch "$BASE_BRANCH" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name browser-performance-report --dir output/playwright/performance-baseline
          fi

      - name: Enforce browser performance budgets
        run: npm run perf:browser
        env:
          CI: true

      - name: Publish performance summary
        if: always()
        run: npm run perf:summary -- --baseline output/playwright/performance-baseline/performance-report.json

      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-performance-report
          path: output/playwright/performance/performance-report.json
          if-no-files-found: error
          retention-days: 30

  # Phase 7 of docs/next-features-acceptance.md: these deterministic
  # acceptance suites must pass on PRs that touch Cost Estimator, EMF,
  # export flows, or Heat Trace sizing.
  acceptance-lanes:
    name: Acceptance Lanes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Cost Estimator acceptance lane
        run: npm run e2e:next-features-cost
        env:
          CI: true

      - name: EMF acceptance lane
        run: npm run e2e:next-features-emf
        env:
          CI: true

      - name: Export validation lane
        run: npm run e2e:next-features-export
        env:
          CI: true

      - name: Heat Trace acceptance lane
        run: npm run e2e:heat-trace
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-lanes-report
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────
  # 6. Security audit
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Run independently of other jobs — don't block main pipeline
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        # Fail only on critical/high severity vulnerabilities
        run: npm audit --audit-level=high
